<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#006BB3" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Bikri POS</title>
    <meta name="bikri-locales" content="" />
    <script>// Apply the chosen theme and language before the first paint. The shop DB is loaded later.
try {
  const theme = localStorage.getItem('bikri.theme');
  if (theme === 'light' || theme === 'dark') {
    document.documentElement.dataset.theme = theme;
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) {
      meta.setAttribute('content', theme === 'dark' ? '#0e1014' : '#006BB3');
    }
  }
  const stored = localStorage.getItem('bikri.language');
  const language =
    stored === 'ur' ? 'ur' : stored === 'roman-ur' ? 'roman-ur' : 'en';
  document.documentElement.lang = language;
  document.documentElement.dir = language === 'ur' ? 'rtl' : 'ltr';
  // Only Urdu uses the Arabic script; roman-ur is Latin and gets Inter.
  // The build writes the hashed locale chunk map into this meta tag, so the catalog
  // starts downloading in parallel with the entry module (no extra preload script RTT).
  try {
    const locales = document.querySelector('meta[name="bikri-locales"]');
    const map = locales ? JSON.parse(locales.getAttribute('content') || '{}') : {};
    const catalog = map[language];
    if (catalog) {
      const link = document.createElement('link');
      link.rel = 'modulepreload';
      link.crossOrigin = '';
      link.href = `%BASE_URL%${catalog}`;
      document.head.appendChild(link);
    }
  } catch {
    /* a malformed map is never worth blocking the app */
  }
  const font =
    language === 'ur'
      ? 'fonts/noto-naskh-arabic-arabic-wght-normal.woff2'
      : 'fonts/inter-latin-wght-normal.woff2';
  // Vite replaces %BASE_URL% with the app base (with a trailing slash) in dev and
  // in the build. `document.baseURI` is the current route, so it requested
  // /bikri/sales/fonts/… on a nested route and /fonts/… at /bikri.
  const preload = document.createElement('link');
  preload.rel = 'preload';
  preload.as = 'font';
  preload.type = 'font/woff2';
  preload.crossOrigin = '';
  preload.href = `%BASE_URL%${font}`;
  document.head.appendChild(preload);
} catch {
  /* storage may be disabled */
}
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
