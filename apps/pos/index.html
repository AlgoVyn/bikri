<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#006BB3" />
    <link rel="icon" href="%BASE_URL%icons/icon-192.png" type="image/png" />
    <title>Bikri POS</title>
    <script>
      // Apply the chosen theme before the first paint. The shop DB is loaded later.
      try {
        const theme = localStorage.getItem('bikri.theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0f172a' : '#006BB3');
        }
      } catch {
        /* storage may be disabled */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
