# Nightly whole-database backup (docs/09 §2): D1 export -> R2 + age-encrypted artifact.
# Schedule 21:30 UTC = 02:30 Asia/Karachi, while the shops are closed.
# Required secrets: CLOUDFLARE_API_TOKEN (D1 + R2), CLOUDFLARE_ACCOUNT_ID,
# BACKUP_AGE_RECIPIENT (the operator's age public key). Never upload the plain dump.
name: backup
on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require the age public key
        run: |
          if [ -z "$BACKUP_AGE_RECIPIENT" ]; then
            echo "::error::BACKUP_AGE_RECIPIENT is not set; refusing to upload a plain backup."
            exit 1
          fi
      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install -y age
      - name: Set the backup date (Asia/Karachi)
        id: date
        run: echo "date=$(TZ=Asia/Karachi date +%F)" >> "$GITHUB_OUTPUT"
      - name: Export D1 and write manifest
        env:
          DATE: ${{ steps.date.outputs.date }}
        run: |
          node tools/backup/export.mjs \
            --out-dir "$RUNNER_TEMP/backup" \
            --date "$DATE"
          gzip -9 "$RUNNER_TEMP/backup/bikri-$DATE.sql"
      - name: Upload the SQL dump and manifest to R2
        working-directory: apps/api
        env:
          DATE: ${{ steps.date.outputs.date }}
        run: |
          pnpm exec wrangler r2 object put "bikri-backups/d1/$DATE.sql.gz" \
            --file="$RUNNER_TEMP/backup/bikri-$DATE.sql.gz" --remote --force
          pnpm exec wrangler r2 object put "bikri-backups/d1/$DATE.manifest.json" \
            --file="$RUNNER_TEMP/backup/bikri-$DATE.manifest.json" --remote --force
      - name: Encrypt the off-Cloudflare copy
        env:
          DATE: ${{ steps.date.outputs.date }}
        run: |
          age --encrypt --recipient "$BACKUP_AGE_RECIPIENT" \
            --output "$RUNNER_TEMP/backup/backup-$DATE.sql.gz.age" \
            "$RUNNER_TEMP/backup/bikri-$DATE.sql.gz"
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: backup-${{ steps.date.outputs.date }}
          path: ${{ runner.temp }}/backup/backup-${{ steps.date.outputs.date }}.sql.gz.age
          retention-days: 90
      - name: Keep 30 daily + 12 monthly backups in R2
        env:
          DATE: ${{ steps.date.outputs.date }}
        run: node tools/backup/retention.mjs --today "$DATE"
      - name: Summary
        if: always()
        env:
          DATE: ${{ steps.date.outputs.date }}
        run: |
          if [ -f "$RUNNER_TEMP/backup/bikri-$DATE.manifest.json" ]; then
            node -e '
              const m = require(process.env.RUNNER_TEMP + "/backup/bikri-" + process.env.DATE + ".manifest.json");
              const tenants = Object.entries(m.tenants);
              const rows = tenants.reduce((sum, [, t]) => sum + Object.values(t.tables).reduce((a, b) => a + b, 0), 0);
              console.log(`## Backup ${m.date}`);
              console.log(`${tenants.length} tenants, ${rows} rows, sha256 ${m.sha256.slice(0, 12)}…`);
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
