# Deploy to https://algovyn.com/bikri/ (01 §7.2, roadmap T-004).
# Order: website check (blocks the deploy, 01 §5.5) → build → D1 migrations → wrangler deploy → smoke test.
# The deploy job runs only once the owner has done the one-time setup in 01 §7.1 and set the
# repository variable DEPLOY_ENABLED=true (Settings → Secrets and variables → Actions → Variables).
# Required secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: deploy
on:
  # Only deploy a main commit after its CI run succeeds. A push to main starts CI; this workflow
  # then starts on the successful workflow_run. Manual dispatch is the explicit bypass.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_website_check:
        description: "Deploy even if the algovyn.com website check fails (logged in the run summary)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  website-check:
    # Only a CI run caused by a push to this repository's main may deploy. `workflow_run.branches`
    # matches the triggering run's head branch, so a fork PR can name its branch `main`; the
    # head_repository and event checks are the actual trust boundary (D-146).
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository &&
           github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Website check (no third-party scripts / service worker on algovyn.com)
        if: ${{ !inputs.skip_website_check }}
        run: node tools/check-website.mjs
      - name: Website check skipped by owner
        if: ${{ inputs.skip_website_check }}
        run: |
          echo "::warning::Website check SKIPPED by ${{ github.actor }} (skip_website_check=true)"
          echo "## ⚠️ Website check skipped by ${{ github.actor }} (skip_website_check=true)" >> "$GITHUB_STEP_SUMMARY"
          node tools/check-website.mjs || true

  deploy:
    needs: website-check
    if: >-
      ${{ vars.DEPLOY_ENABLED == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main' &&
            github.event.workflow_run.head_repository.full_name == github.repository &&
            github.event.workflow_run.conclusion == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refuse the placeholder D1 database_id
        run: |
          if grep -q '00000000-0000-0000-0000-000000000000' apps/api/wrangler.jsonc; then
            echo "::error::apps/api/wrangler.jsonc still has the placeholder database_id. Run 'wrangler d1 create bikri' and commit the id (01 §7.1)."
            exit 1
          fi
      - name: Refuse the placeholder ACCESS_TEAM_DOMAIN
        run: |
          if grep -q '<team>\.cloudflareaccess\.com' apps/api/wrangler.jsonc; then
            echo "::error::apps/api/wrangler.jsonc still has the placeholder ACCESS_TEAM_DOMAIN. Set it to the Zero Trust team domain (01 §7.1)."
            exit 1
          fi
      - run: pnpm build
      - name: Apply D1 migrations (remote)
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply bikri --remote
      - name: Deploy Worker
        working-directory: apps/api
        run: pnpm exec wrangler deploy
      - name: Smoke test
        run: |
          curl -fsS https://algovyn.com/bikri/api/health | tee /dev/stderr | grep -q '"ok":true'
          curl -fsSI https://algovyn.com/bikri/ | grep -qi '^content-security-policy:'
          test "$(curl -s -o /dev/null -w '%{http_code}' https://algovyn.com/)" = "200"
