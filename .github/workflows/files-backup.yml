# Weekly R2 file backup (docs/09 §1 layer 7, §2.1): list every till file (shop logo,
# product photos) under t/, download it, then tar + age-encrypt the archive.
# Schedule 22:45 UTC Sunday = 03:45 Asia/Karachi Monday, after the nightly D1 export.
# Required secrets: CLOUDFLARE_API_TOKEN (R2 read on bikri-files), CLOUDFLARE_ACCOUNT_ID,
# BACKUP_AGE_RECIPIENT. Never upload or retain a plain archive.
name: files-backup
on:
  schedule:
    - cron: "45 22 * * 0"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: files-backup
  cancel-in-progress: false
jobs:
  files:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Require the age public key
        env:
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          if [ -z "$BACKUP_AGE_RECIPIENT" ]; then
            echo "::error::BACKUP_AGE_RECIPIENT is not set; refusing to upload a plain archive."
            exit 1
          fi
      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install -y age
      - name: Set the backup date (Asia/Karachi)
        id: date
        run: echo "date=$(TZ=Asia/Karachi date +%F)" >> "$GITHUB_OUTPUT"
      - name: List and download the file bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATE: ${{ steps.date.outputs.date }}
        run: |
          node tools/backup/files.mjs \
            --out-dir "$RUNNER_TEMP/files-backup" \
            --date "$DATE"
      - name: Archive and encrypt
        env:
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          DATE: ${{ steps.date.outputs.date }}
        run: |
          tar -C "$RUNNER_TEMP/files-backup" -czf "$RUNNER_TEMP/files-$DATE.tar.gz" .
          age --encrypt --recipient "$BACKUP_AGE_RECIPIENT" \
            --output "$RUNNER_TEMP/files-$DATE.tar.gz.age" \
            "$RUNNER_TEMP/files-$DATE.tar.gz"
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: files-${{ steps.date.outputs.date }}
          path: ${{ runner.temp }}/files-${{ steps.date.outputs.date }}.tar.gz.age
          retention-days: 90
      - name: Summary
        if: always()
        env:
          DATE: ${{ steps.date.outputs.date }}
        run: |
          if [ -f "$RUNNER_TEMP/files-backup/files-$DATE.manifest.json" ]; then
            node -e '
              const fs = require("fs");
              const m = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/files-backup/files-" + process.env.DATE + ".manifest.json", "utf8"));
              console.log(`## File backup ${m.date}`);
              console.log(`${m.objects} objects, ${(m.bytes / 1048576).toFixed(1)} MB across ${Object.keys(m.tenants).length} shops.`);
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
